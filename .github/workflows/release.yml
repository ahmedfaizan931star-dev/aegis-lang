name: Release

# Push a tag like v0.1.0 and this builds the CLI and attaches it to a GitHub release.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Checksum
        run: cd dist && sha256sum aegis.mjs > aegis.mjs.sha256
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/aegis.mjs dist/aegis.mjs.sha256 --generate-notes
